services:
  - type: web
    name: vyapar-sarthi-sangi
    env: python
    buildCommand: "pip install -r pybackend/requirements.txt"
    startCommand: "cd pybackend && python main.py"
    envVars:
      - key: MongDB
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_NAME
        value: test
